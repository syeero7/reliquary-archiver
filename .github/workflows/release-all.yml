name: Create Release (win & linux)
on:
  workflow_dispatch:
    inputs:
      nextVersion:
        description: "new version to push"
        required: true
        default: "0.0.0"

      skipPreBuild:
        description: "skip pre-build job"
        type: boolean
        required: false
        default: false

permissions: {}

jobs:
  pre-build:
    if: ${{ !inputs.skipPreBuild }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # contents: write

    steps:
      - uses: actions/checkout@v6
      - uses: moonrepo/setup-rust@v1
      - name: Install toml-cli
        run: cargo install toml-cli

      - name: Update Cargo.toml with new version
        # piping the output of toml-cli directly into the file will cause the file to be deleted before being read
        # by toml-cli. excuse this workaround.
        run: |
          toml set Cargo.toml package.version ${{inputs.nextVersion}} > Cargo.toml.tmp
          rm Cargo.toml
          mv Cargo.toml.tmp Cargo.toml
          cargo generate-lockfile

      - name: Push updated version
        run: |
          git config user.name "reliquary-archiver bot"
          git config user.email "reliquary-archiver.bot@users.noreply.github.com"
          git config --global push.followTags true

          git add Cargo.toml Cargo.lock
          git commit -m "[skip ci] bump version to v${{inputs.nextVersion}}"
          git tag v${{inputs.nextVersion}}
          git push origin main

  build:
    needs: [pre-build]
    if: always() && !contains(needs.pre-build.result, 'failure') && !contains(needs.pre-build.result, 'cancelled')

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: reliquary-archiver-pcap
            os: windows-latest
            platform: windows

          - name: reliquary-archiver-pktmon
            os: windows-latest
            platform: windows

          - name: reliquary-archiver-linux
            os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
      - uses: moonrepo/setup-rust@v1

      - name: Download and extract npcap
        if: matrix.platform == 'windows'
        run: |
          curl --silent --show-error --fail -o ./npcap-sdk.zip "https://npcap.com/dist/npcap-sdk-1.13.zip"
          unzip -p npcap-sdk.zip Lib/x64/Packet.lib > Packet.lib
          unzip -p npcap-sdk.zip Lib/x64/wpcap.lib > wpcap.lib

      - name: Build pcap Windows exe
        if: matrix.platform == 'windows' && matrix.name == 'reliquary-archiver-pcap'
        run: |
          cargo build --release --no-default-features --features pcap,stream,gui
          mv -Force target/release/reliquary-archiver.exe reliquary-archiver-pcap-x64.exe

      - name: run reliquary-pcap --help
        if: matrix.platform == 'windows' && matrix.name == 'reliquary-archiver-pcap'
        run: |
          .\reliquary-archiver-pcap-x64.exe --help

      - name: Build pktmon Windows exe
        if: matrix.platform == 'windows' && matrix.name == 'reliquary-archiver-pktmon'
        run: |
          cargo build --release --no-default-features --features pktmon,stream,gui
          mv -Force target/release/reliquary-archiver.exe reliquary-archiver-pktmon-x64.exe

      - name: run reliquary-pktmon --help
        if: matrix.platform == 'windows' && matrix.name == 'reliquary-archiver-pktmon'
        run: |
          .\reliquary-archiver-pktmon-x64.exe --help

      - name: Install dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update 
          sudo apt install -y libpcap-dev libwayland-dev

      - name: Build AppImage for Linux
        if: matrix.platform == 'linux' && matrix.name == 'reliquary-archiver-linux'
        run: |
          cargo build --release --no-default-features --features pcap,stream
          chmod +x pack_appimage.bash

          APPIMAGE="${{ matrix.name }}.AppImage"
          ./pack_appimage.bash $APPIMAGE

          echo "test appimage"
          sudo apt purge -y libpcap-dev libwayland-dev
          sudo apt autoremove -y
          chmod +x $APPIMAGE
          $APPIMAGE_NAME --help

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "${{ matrix.name }}-x64"
          path: |
            ./reliquary-archiver*.exe
            ./reliquary-archiver*.AppImage

